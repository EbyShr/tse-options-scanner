# ==============================================================================
# پیکربندی اسکنر روزانه بازار آپشن بورس تهران (TSETMC)
# ==============================================================================

# دارایی‌های پایه هدف جهت پایش و غربالگری (۲۴ نماد پایه بازار)
target_underlying_symbols:
  - "وبملت"
  - "خودرو"
  - "شستا"
  - "خساپا"
  - "وتجارت"
  - "فملی"
  - "اخابر"
  - "وبصادر"
  - "ذوب"
  - "شپنا"
  - "خبهمن"
  - "فرابورس"
  - "تاصیکو"
  - "بساما"
  - "اهرم"
  - "فزر"
  - "کاریس"
  - "دارونو"
  - "موج"
  - "توان"
  - "اطلس"
  - "جوانه کوچک"
  - "همتراز"
  - "طعام"

# تنظیمات ارزش‌گذاری بلک-شولز و مدل تئوریک
valuation:
  # نرخ بدون ریسک سالانه فرضی (درصد به اعشار، مثلاً ۰.۲۸ معادل ۲۸٪)
  risk_free_rate: 0.28
  # بازه روزهای معاملاتی برای محاسبه نوسان‌پذیری تاریخی دارایی پایه (جهت فالبک BSM)
  historical_volatility_window: 30
  # بازده سود نقدی فرضی (Dividend Yield)
  dividend_yield: 0.0

# فیلترهای نقدینگی واقعی و هشدارهای معاملاتی
liquidity_filter:
  # حداقل ارزش معامله امروز به ریال برای برچسب نقدشونده (پیش‌فرض: ۵۰۰ میلیون ریال / ۵۰ میلیون تومان)
  min_trade_value_rials: 500000000
  # حداقل تعداد معاملات (Trade Count) در طول روز جاری
  min_trade_count: 5
  # تعداد روزهای معاملاتی قبل جهت محاسبه میانگین ارزش معامله (تشخیص کم‌معامله بودن غیرعادی)
  lookback_days_avg: 5
  # متن برچسب وضعیت نقدینگی
  low_liquidity_label: "کم‌عمق / ریسک نقدشوندگی بالا"
  normal_liquidity_label: "نقدشونده / عادی"

# الگوریتم امتیازدهی واحد و جامع — نسخه v3 (calculate_score)
unified_scoring:
  # وزن‌های ۵ مؤلفه اصلی نسخه v3 (مجموع = ۱.۰)
  weights:
    underlying_readiness: 0.25       # آمادگی دارایی پایه (۲۵٪)
    relative_value: 0.20             # ارزش نسبی / حباب BSM (۲۰٪)
    leverage: 0.15                   # اهرم به عنوان جزء مستقل جدید (۱۵٪)
    combined_liquidity: 0.25         # نقدینگی ترکیبی (۲۵٪)
    dte_suitability: 0.15            # تناسب روزهای سررسید DTE (۱۵٪)

  # زیربخش‌های نقدینگی ترکیبی (از کل ۲۵٪: سهم ۶۰٪ ساختاری + ۴۰٪ جهش)
  liquidity_breakdown:
    structural_weight: 0.15          # نقدینگی ساختاری: میانگین ۵ روزه ارزش و تعداد معاملات (۱۵٪)
    spike_weight: 0.10               # جهش لحظه‌ای: نسبت ارزش امروز به میانگین ۵ روزه (۱۰٪)

  # فیلترهای سخت سه‌گانه ورود به Top 10 (Deep-OTM، نقدینگی و گیت سخت اهرم)
  hard_filter:
    min_dte: 3                        # حداقل ۳ روز تا سررسید (حذف ریسک انقضا و گاما)
    min_leverage_call: 3.0            # حداقل اهرم اختیار خرید (Call) جهت ورود به رقابت (گیت مرحله ۳)
    min_leverage_put: 3.0             # حداقل اهرم اختیار فروش (Put) جهت ورود به رقابت (گیت مرحله ۳)
    call:
      min_trade_value_rials: 5000000000 # حداقل ۵,۰۰۰ میلیون ریال (۵۰۰ میلیون تومان)
      min_trade_count: 30               # حداقل ۳۰ معامله در روز
      min_leverage: 3.0                 # حداقل اهرم اختیار خرید
    put:
      min_trade_value_rials: 1000000000 # حداقل ۱,۰۰۰ میلیون ریال (۱۰۰ میلیون تومان)
      min_trade_count: 10               # حداقل ۱۰ معامله در روز
      min_leverage: 3.0                 # حداقل اهرم اختیار فروش

  # سقف ضد-Chasing دینامیک (متناسب با سقف واقعی دامنه نوسان بورس تهران)
  anti_chasing:
    penalty_factor: 0.70              # ضریب کاهشی امتیاز آمادگی پایه (ضرب در ۰.۷)
    chasing_safety_ratio: 0.90        # ضریب ایمنی ۹۰٪ حداکثر حرکت ممکن
    daily_bands:
      leveraged: 0.04                 # صندوق‌های اهرمی (۴٪ روزانه: اهرم، توان، موج، اطلس و ...)
      regular: 0.03                   # سهام عادی و سایر نمادها (۳٪ روزانه)
    leveraged_symbols:                # لیست نمادهای اهرمی جهت فالبک در صورت عدم دسترسی به دیتای برخط TSETMC
      - "اهرم"
      - "توان"
      - "موج"
      - "اطلس"
      - "جهش"
      - "شتاب"
      - "نارنج"
      - "بیدار"

  # مهار انفجار حباب در قراردادهای عمیقاً در زیان (Deep OTM)
  deep_otm_cap:
    min_bsm_price: 10.0               # حداقل قیمت تئوریک BSM به ریال
    min_delta: 0.10                   # حداقل دلتای مطلق تخمینی

  # منحنی سررسید بهینه DTE
  dte_curve:
    optimal_min: 10
    optimal_max: 40

  # سقف تنوع نمادهای برتر (حداکثر تعداد قرارداد مجاز از هر دارایی پایه در Top 10)
  max_per_underlying: 3

  # آستانه هشدار تمرکز نماد پایه
  max_same_underlying_alert: 3

# تنظیمات خروجی فایل گزارش
output:
  directory: "outputs"
  filename_prefix: "options_scan"
  # آیا علاوه بر فایل اکسل، خروجی CSV شیت اصلی نیز ذخیره شود؟
  export_csv: true
  # آیا فایل خلاصه CSV اختصاصی گزینه‌های برتر (Top Call & Put) ذخیره شود؟
  export_top_choices_csv: true

# تنظیمات اتصال و شبکه
network:
  request_timeout: 12
  max_retries: 3
  concurrency_workers: 10
